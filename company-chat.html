<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Company Live Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 18px;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    .chat {
      height: calc(100vh - 145px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 80%;
      padding: 10px 13px;
      margin-bottom: 10px;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .customer {
      margin-left: auto;
      background: #dcf8c6;
    }

    .ai {
      margin-right: auto;
      background: white;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 10px;
      display: flex;
      gap: 8px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }

    .input-area button {
      border: none;
      background: #075e54;
      color: white;
      padding: 0 18px;
      border-radius: 20px;
      font-weight: bold;
    }

    .input-area button:disabled {
      background: #aaa;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>🏢 ABC Company</h2>
    <p>🤖 AI Customer Service • Online</p>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Tulis pesan..."
      autocomplete="off"
    >

    <button id="sendButton">
      Kirim
    </button>
  </div>

  <script>
    const API_URL =
      "/api/company/chat";

    const COMPANY_ID =
      "ABC001";

    const CUSTOMER_ID =
      "USER001";

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    function addMessage(
      text,
      type
    ) {
      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " + type;

      message.textContent =
        text;

      chat.appendChild(
        message
      );

      chat.scrollTop =
        chat.scrollHeight;
    }

    async function sendMessage() {
      const message =
        input.value.trim();

      if (!message) {
        return;
      }

      addMessage(
        message,
        "customer"
      );

      input.value = "";

      sendButton.disabled = true;

      try {
        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  companyId:
                    COMPANY_ID,

                  customerId:
                    CUSTOMER_ID,

                  message:
                    message
                })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            "Gagal menghubungi AI."
          );
        }

        addMessage(
          data.reply ||
          "AI tidak memberikan jawaban.",
          "ai"
        );

      } catch (error) {

        addMessage(
          "Terjadi kesalahan: " +
          error.message,
          "ai"
        );

      } finally {
        sendButton.disabled =
          false;

        input.focus();
      }
    }

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      function (event) {
        if (
          event.key === "Enter"
        ) {
          sendMessage();
        }
      }
    );

    addMessage(
      "Halo Andi 👋 Ada yang bisa kami bantu?",
      "ai"
    );
  </script>

</body>
</html>
