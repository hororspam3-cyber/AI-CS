<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Service</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #1769ff;
      color: white;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      color: #1769ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header h2 {
      font-size: 17px;
    }

    .status {
      font-size: 12px;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      background: #f7f9fc;
    }

    .message {
      max-width: 80%;
      padding: 11px 14px;
      margin-bottom: 12px;
      border-radius: 14px;
      line-height: 1.45;
      font-size: 14px;
      word-wrap: break-word;
    }

    .bot {
      background: white;
      border: 1px solid #e5e9f0;
      margin-right: auto;
    }

    .user {
      background: #1769ff;
      color: white;
      margin-left: auto;
    }

    .input-area {
      padding: 12px;
      background: white;
      border-top: 1px solid #e5e9f0;
      display: flex;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      border: 1px solid #d8dee9;
      border-radius: 22px;
      padding: 12px 16px;
      outline: none;
      font-size: 14px;
    }

    .send-btn {
      border: none;
      background: #1769ff;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .send-btn:disabled {
      opacity: 0.5;
    }

    @media (max-width: 600px) {
      body {
        align-items: stretch;
      }

      .chat-container {
        height: 100vh;
        max-width: none;
        border-radius: 0;
      }
    }
  </style>

</head>

<body>

  <div class="chat-container">

```
<div class="header">
  <div class="avatar">🤖</div>

  <div>
    <h2>AI Customer Service</h2>
    <div class="status">● Online • Siap membantu</div>
  </div>
</div>

<div class="messages" id="messages">
  <div class="message bot">
    Halo 👋 Selamat datang di Customer Service.
    Ada yang bisa saya bantu?
  </div>
</div>

<div class="input-area">
  <input
    id="messageInput"
    type="text"
    placeholder="Tulis pertanyaan..."

  >

  <button class="send-btn" id="sendButton">➤</button>

```

  </div>

  <script>
    const API_URL = window.location.origin;

    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const messages = document.getElementById("messages");

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;

      return message;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text || button.disabled) {
        return;
      }

      addMessage(text, "user");

      input.value = "";
      button.disabled = true;

      const typingMessage = addMessage(
        "Sedang mengetik...",
        "bot"
      );

      try {
        const response = await fetch("/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        typingMessage.remove();

        if (response.ok && data.reply) {
          addMessage(data.reply, "bot");
        } else {
          addMessage(
            data.error || "AI belum memberikan jawaban.",
            "bot"
          );
        }

      } catch (error) {
        typingMessage.remove();

        addMessage(
          "Tidak dapat terhubung ke server.",
          "bot"
        );

        console.error(error);
      }

      button.disabled = false;
      input.focus();
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
