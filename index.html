```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC Company - AI Customer Service</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      min-height: 600px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background: #1976d2;
      color: white;
      padding: 20px;
    }

    .company {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .title {
      font-size: 18px;
    }

    .status {
      font-size: 14px;
      margin-top: 5px;
    }

    .menu {
      display: flex;
      gap: 8px;
      padding: 15px;
      overflow-x: auto;
    }

    .menu button {
      border: none;
      background: #e8f1fb;
      padding: 10px 14px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .menu button:hover {
      background: #d2e5f8;
    }

    .chat {
      padding: 20px;
      min-height: 250px;
    }

    .bot-message {
      background: #f0f2f5;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .user-message {
      background: #1976d2;
      color: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 15px;
      border-top: 1px solid #ddd;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }

    .input-area button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    .input-area button:hover {
      background: #125aa0;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="company">🏢 ABC Company</div>
      <div class="title">🤖 AI Customer Service</div>
      <div class="status">● Online • Siap membantu</div>
    </div>

    <div class="menu">
      <button onclick="pilihKategori('Akun')">👤 Akun</button>
      <button onclick="pilihKategori('Pembelian')">🛒 Pembelian</button>
      <button onclick="pilihKategori('Pembayaran')">💳 Pembayaran</button>
      <button onclick="pilihKategori('Transaksi')">📄 Transaksi</button>
    </div>

    <div class="chat" id="chat">

      <div class="bot-message">
        Halo 👋 Selamat datang di Customer Service ABC Company.
        <br><br>
        Ada yang bisa saya bantu?
      </div>

    </div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Ketik pertanyaan kamu..."
        onkeydown="tekanEnter(event)"
      >

      <button onclick="kirimPesan()">Kirim</button>
    </div>

  </div>

  <script>
    function pilihKategori(kategori) {

      const chat = document.getElementById("chat");

      let jawaban = "";

      if (kategori === "Akun") {
        jawaban = "Untuk masalah akun, silakan jelaskan masalah akun kamu. Contoh: lupa password atau ingin mengubah data akun.";
      }

      if (kategori === "Pembelian") {
        jawaban = "Untuk masalah pembelian, silakan berikan informasi mengenai produk atau pesanan yang ingin kamu tanyakan.";
      }

      if (kategori === "Pembayaran") {
        jawaban = "Untuk masalah pembayaran, silakan jelaskan metode pembayaran atau kendala pembayaran yang kamu alami.";
      }

      if (kategori === "Transaksi") {
        jawaban = "Untuk mengecek transaksi, silakan berikan nomor transaksi atau jelaskan transaksi yang ingin kamu tanyakan.";
      }

      chat.innerHTML += `
        <div class="user-message">
          ${kategori}
        </div>

        <div class="bot-message">
          ${jawaban}
        </div>
      `;

      chat.scrollTop = chat.scrollHeight;
    }


    function kirimPesan() {

      const input = document.getElementById("userInput");
      const pesan = input.value.trim();

      if (pesan === "") {
        return;
      }

      const chat = document.getElementById("chat");

      chat.innerHTML += `
        <div class="user-message">
          ${pesan}
        </div>

        <div class="bot-message">
          🤖 Terima kasih atas pertanyaannya. Ini masih merupakan AI Customer Service <b>dummy</b>. Jawaban otomatis akan kita kembangkan pada tahap berikutnya.
        </div>
      `;

      input.value = "";

      chat.scrollTop = chat.scrollHeight;
    }


    function tekanEnter(event) {

      if (event.key === "Enter") {
        kirimPesan();
      }

    }
  </script>

</body>
</html>
```
