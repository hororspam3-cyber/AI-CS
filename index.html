<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ABC Company - AI Customer Service</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f6;
    }

    .container {
      width: 100%;
      max-width: 650px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1976d2;
      color: white;
      padding: 20px;
    }

    .company {
      font-size: 22px;
      font-weight: bold;
    }

    .title {
      font-size: 18px;
      margin-top: 6px;
    }

    .status {
      font-size: 13px;
      margin-top: 6px;
    }

    .login-area {
      padding: 14px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .login-row {
      display: flex;
      gap: 10px;
    }

    .login-row select {
      flex: 1;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-size: 14px;
    }

    .login-row button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .account-info {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #eef7ff;
      border-radius: 8px;
      font-size: 14px;
    }

    .logout {
      margin-top: 8px;
      border: none;
      background: #e53935;
      color: white;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .menu {
      display: flex;
      gap: 10px;
      padding: 14px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      overflow-x: auto;
    }

    .menu button {
      border: 1px solid #d8e2ec;
      background: #f5f9fd;
      padding: 11px 16px;
      border-radius: 25px;
      white-space: nowrap;
      font-size: 14px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f7f9fb;
    }

    .bot-message {
      max-width: 85%;
      background: white;
      padding: 14px 16px;
      border-radius: 15px;
      margin-bottom: 15px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .user-message {
      max-width: 85%;
      margin-left: auto;
      background: #1976d2;
      color: white;
      padding: 14px 16px;
      border-radius: 15px;
      margin-bottom: 15px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 14px;
      background: white;
      border-top: 1px solid #ddd;
    }

    .input-area input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #d0d7de;
      border-radius: 25px;
      font-size: 15px;
      outline: none;
    }

    .input-area button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 0 22px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

  </style>

</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div class="company">
      🏢 ABC Company
    </div>

    <div class="title">
      🤖 AI Customer Service
    </div>

    <div class="status">
      ● Online • Siap membantu
    </div>

  </div>


  <!-- LOGIN DEMO -->

  <div class="login-area">

    <div class="login-row">

      <select id="customerSelect">

        <option value="">
          Pilih akun demo
        </option>

        <option value="USER001">
          USER001 - Andi
        </option>

        <option value="USER002">
          USER002 - Budi
        </option>

        <option value="USER003">
          USER003 - Citra
        </option>

      </select>

      <button onclick="loginDemo()">
        Login
      </button>

    </div>

    <div
      id="accountInfo"
      class="account-info"
    >

      <b>Akun aktif</b>

      <br>

      <span id="loggedUser"></span>

      <br>

      <button
        class="logout"
        onclick="logoutDemo()"
      >
        Logout
      </button>

    </div>

  </div>


  <!-- MENU -->

  <div class="menu">

    <button onclick="pilihKategori('Akun')">
      👤 Akun
    </button>

    <button onclick="pilihKategori('Pembelian')">
      🛒 Pembelian
    </button>

    <button onclick="pilihKategori('Pembayaran')">
      💳 Pembayaran
    </button>

    <button onclick="pilihKategori('Transaksi')">
      📄 Transaksi
    </button>

  </div>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat"
  >

    <div class="bot-message">

      <b>🤖 AI Customer Service</b>

      <br><br>

      Halo 👋 Selamat datang di
      <b>ABC Company</b>.

      <br><br>

      Silakan login menggunakan
      akun demo untuk mencoba
      fitur customer service.

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <input
      type="text"
      id="userInput"
      placeholder="Ketik pertanyaan kamu..."
      autocomplete="off"
      onkeydown="tekanEnter(event)"
    >

    <button
      id="sendButton"
      onclick="kirimPesan()"
    >
      Kirim
    </button>

  </div>

</div>


<script>

  // =====================================
  // CUSTOMER YANG SEDANG LOGIN
  // =====================================

  let currentCustomerId = "";


  // =====================================
  // LOGIN
  // =====================================

  function loginDemo() {

    const select =
      document.getElementById("customerSelect");

    const customerId =
      select.value;

    if (!customerId) {

      alert(
        "Silakan pilih akun terlebih dahulu."
      );

      return;

    }

    currentCustomerId =
      customerId;

    const accountInfo =
      document.getElementById("accountInfo");

    const loggedUser =
      document.getElementById("loggedUser");

    loggedUser.textContent =
      customerId;

    accountInfo.style.display =
      "block";

    tambahPesanBot(
      "Login berhasil sebagai " +
      customerId +
      ". Sekarang saya dapat membantu mengecek informasi akun Anda."
    );

  }


  // =====================================
  // LOGOUT
  // =====================================

  function logoutDemo() {

    currentCustomerId = "";

    document.getElementById(
      "accountInfo"
    ).style.display = "none";

    document.getElementById(
      "customerSelect"
    ).value = "";

    tambahPesanBot(
      "Anda telah logout. Silakan login kembali untuk mengecek informasi akun."
    );

  }


  // =====================================
  // KATEGORI
  // =====================================

  function pilihKategori(kategori) {

    let pertanyaan = "";

    if (kategori === "Akun") {

      pertanyaan =
        "Saya ingin bertanya tentang akun saya.";

    }

    else if (kategori === "Pembelian") {

      pertanyaan =
        "Bagaimana cara melakukan pembelian?";

    }

    else if (kategori === "Pembayaran") {

      pertanyaan =
        "Saya ingin bertanya tentang pembayaran.";

    }

    else if (kategori === "Transaksi") {

      pertanyaan =
        "Saya ingin mengecek transaksi saya.";

    }

    document.getElementById(
      "userInput"
    ).value = pertanyaan;

    kirimPesan();

  }


  // =====================================
  // KIRIM PESAN
  // =====================================

  async function kirimPesan() {

    const input =
      document.getElementById(
        "userInput"
      );

    const pesan =
      input.value.trim();

    if (!pesan) {
      return;
    }


    // Tampilkan pesan customer

    tambahPesanUser(
      pesan
    );

    input.value = "";


    // Tampilkan loading

    const loading =
      tambahPesanBot(
        "🤖 Sedang memeriksa informasi..."
      );


    try {

      const response =
        await fetch(
          "/chat",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              message: pesan,

              customerId:
                currentCustomerId

            })

          }
        );


      const data =
        await response.json();


      // Hapus loading

      loading.remove();


      // Tampilkan jawaban AI

      tambahPesanBot(
        data.reply ||
        "Maaf, AI tidak memberikan jawaban."
      );


    }

    catch (error) {

      console.error(
        "CHAT ERROR:",
        error
      );


      loading.remove();


      tambahPesanBot(
        "⚠️ Maaf, terjadi masalah saat menghubungkan ke AI."
      );

    }

  }


  // =====================================
  // ENTER
  // =====================================

  function tekanEnter(event) {

    if (
      event.key === "Enter"
    ) {

      kirimPesan();

    }

  }


  // =====================================
  // USER MESSAGE
  // =====================================

  function tambahPesanUser(
    pesan
  ) {

    const chat =
      document.getElementById(
        "chat"
      );

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "user-message";

    div.textContent =
      pesan;

    chat.appendChild(
      div
    );

    chat.scrollTop =
      chat.scrollHeight;

  }


  // =====================================
  // BOT MESSAGE
  // =====================================

  function tambahPesanBot(
    pesan
  ) {

    const chat =
      document.getElementById(
        "chat"
      );

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "bot-message";

    div.textContent =
      pesan;

    chat.appendChild(
      div
    );

    chat.scrollTop =
      chat.scrollHeight;

    return div;

  }

</script>

</body>

</html>
