```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ABC Company - AI Customer Service</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f6;
    }

    .container {
      width: 100%;
      max-width: 650px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      background: #1976d2;
      color: white;
      padding: 20px;
    }

    .company {
      font-size: 22px;
      font-weight: bold;
    }

    .title {
      font-size: 18px;
      margin-top: 6px;
    }

    .status {
      font-size: 13px;
      margin-top: 6px;
      opacity: 0.9;
    }

    /* CATEGORY */

    .menu {
      display: flex;
      gap: 10px;
      padding: 14px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      overflow-x: auto;
    }

    .menu button {
      border: 1px solid #d8e2ec;
      background: #f5f9fd;
      padding: 11px 16px;
      border-radius: 25px;
      white-space: nowrap;
      font-size: 14px;
      cursor: pointer;
    }

    .menu button:hover {
      background: #e3f0fc;
    }

    /* CHAT */

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f7f9fb;
    }

    .bot-message {
      max-width: 85%;
      background: white;
      padding: 14px 16px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      line-height: 1.5;
    }

    .user-message {
      max-width: 85%;
      margin-left: auto;
      background: #1976d2;
      color: white;
      padding: 14px 16px;
      border-radius: 15px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    /* INPUT */

    .input-area {
      display: flex;
      gap: 10px;
      padding: 14px;
      background: white;
      border-top: 1px solid #ddd;
    }

    .input-area input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #d0d7de;
      border-radius: 25px;
      font-size: 15px;
      outline: none;
    }

    .input-area input:focus {
      border-color: #1976d2;
    }

    .input-area button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 0 22px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    .input-area button:hover {
      background: #125aa0;
    }

    /* DESKTOP */

    @media (min-width: 651px) {

      .container {
        height: 95vh;
        margin-top: 2.5vh;
        margin-bottom: 2.5vh;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 5px 25px rgba(0,0,0,0.12);
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <div class="company">
        🏢 ABC Company
      </div>

      <div class="title">
        🤖 AI Customer Service
      </div>

      <div class="status">
        ● Online • Siap membantu
      </div>

    </div>


    <!-- CATEGORY -->

    <div class="menu">

      <button onclick="pilihKategori('Akun')">
        👤 Akun
      </button>

      <button onclick="pilihKategori('Pembelian')">
        🛒 Pembelian
      </button>

      <button onclick="pilihKategori('Pembayaran')">
        💳 Pembayaran
      </button>

      <button onclick="pilihKategori('Transaksi')">
        📄 Transaksi
      </button>

    </div>


    <!-- CHAT -->

    <div class="chat" id="chat">

      <div class="bot-message">

        <b>🤖 AI Customer Service</b>

        <br><br>

        Halo 👋 Selamat datang di
        <b>ABC Company</b>.

        <br><br>

        Ada yang bisa saya bantu hari ini?

      </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ketik pertanyaan kamu..."
        onkeydown="tekanEnter(event)"
      >

      <button onclick="kirimPesan()">
        Kirim
      </button>

    </div>

  </div>


  <script>

    function pilihKategori(kategori) {

      const chat = document.getElementById("chat");

      let jawaban = "";

      if (kategori === "Akun") {

        jawaban =
        "Untuk masalah akun, silakan jelaskan masalah yang kamu alami. Contohnya lupa password atau ingin mengubah data akun.";

      }

      if (kategori === "Pembelian") {

        jawaban =
        "Untuk masalah pembelian, silakan jelaskan produk atau pesanan yang ingin kamu tanyakan.";

      }

      if (kategori === "Pembayaran") {

        jawaban =
        "Untuk masalah pembayaran, silakan jelaskan metode pembayaran atau kendala pembayaran yang kamu alami.";

      }

      if (kategori === "Transaksi") {

        jawaban =
        "Untuk masalah transaksi, silakan berikan nomor transaksi atau jelaskan transaksi yang ingin kamu tanyakan.";

      }

      chat.innerHTML += `

        <div class="user-message">
          ${kategori}
        </div>

        <div class="bot-message">
          ${jawaban}
        </div>

      `;

      chat.scrollTop = chat.scrollHeight;

    }


    function kirimPesan() {

      const input = document.getElementById("userInput");

      const pesan = input.value.trim();

      if (pesan === "") {
        return;
      }

      const chat = document.getElementById("chat");

      chat.innerHTML += `

        <div class="user-message">
          ${pesan}
        </div>

        <div class="bot-message">

          🤖 Terima kasih atas pertanyaannya.

          <br><br>

          Ini masih merupakan
          <b>AI Customer Service dummy</b>.

          <br><br>

          Jawaban otomatis akan kita kembangkan pada tahap berikutnya.

        </div>

      `;

      input.value = "";

      chat.scrollTop = chat.scrollHeight;

    }


    function tekanEnter(event) {

      if (event.key === "Enter") {

        kirimPesan();

      }

    }

  </script>

</body>
</html>
```
